<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #f9fafb;
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .scoreboard {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
      user-select: none;
    }

    canvas {
      display: block;
      background: #0f172a;
      border: 3px solid #f8fafc;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="scoreboard">
      <span id="leftScore">0</span> : <span id="rightScore">0</span>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const leftScoreEl = document.getElementById("leftScore");
    const rightScoreEl = document.getElementById("rightScore");

    const paddleWidth = 12;
    const paddleHeight = 90;
    const paddleSpeed = 7;

    const leftPaddle = {
      x: 20,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      color: "#60a5fa",
      speed: 0
    };

    const rightPaddle = {
      x: canvas.width - 20 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      color: "#fca5a5",
      speed: 0
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 9,
      vx: 5,
      vy: 4,
      speed: 6,
      color: "#f8fafc"
    };

    let leftScore = 0;
    let rightScore = 0;

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    // Mouse movement controls the left paddle
    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = event.clientY - rect.top;
      leftPaddle.y = mouseY - leftPaddle.height / 2;
      leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        keys[event.key] = true;
      }
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        keys[event.key] = false;
      }
    });

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * Math.PI / 2) - Math.PI / 4; // -45° to 45°
      ball.vx = Math.cos(angle) * ball.speed * direction;
      ball.vy = Math.sin(angle) * ball.speed;
    }

    function updatePaddles() {
      if (keys.ArrowUp) {
        leftPaddle.y -= paddleSpeed;
      }
      if (keys.ArrowDown) {
        leftPaddle.y += paddleSpeed;
      }

      leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));

      // Computer-controlled right paddle
      const targetY = ball.y - rightPaddle.height / 2;
      const diff = targetY - rightPaddle.y;
      const aiSpeed = 5.2;

      if (Math.abs(diff) > 2) {
        rightPaddle.y += diff > 0 ? aiSpeed : -aiSpeed;
      }

      rightPaddle.y = Math.max(0, Math.min(canvas.height - rightPaddle.height, rightPaddle.y));
    }

    function handleWallCollision() {
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      }

      if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }
    }

    function handlePaddleCollision() {
      const leftHit =
        ball.x - ball.radius <= leftPaddle.x + leftPaddle.width &&
        ball.x + ball.radius >= leftPaddle.x &&
        ball.y >= leftPaddle.y &&
        ball.y <= leftPaddle.y + leftPaddle.height;

      if (leftHit) {
        ball.x = leftPaddle.x + leftPaddle.width + ball.radius;
        const relativeIntersect = (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
        const bounceAngle = relativeIntersect * (Math.PI / 3); // max 60°
        const speed = Math.hypot(ball.vx, ball.vy) + 0.6;
        ball.vx = Math.cos(bounceAngle) * speed;
        ball.vy = Math.sin(bounceAngle) * speed;
      }

      const rightHit =
        ball.x + ball.radius >= rightPaddle.x &&
        ball.x - ball.radius <= rightPaddle.x + rightPaddle.width &&
        ball.y >= rightPaddle.y &&
        ball.y <= rightPaddle.y + rightPaddle.height;

      if (rightHit) {
        ball.x = rightPaddle.x - ball.radius;
        const relativeIntersect = (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
        const bounceAngle = relativeIntersect * (Math.PI / 3);
        const speed = Math.hypot(ball.vx, ball.vy) + 0.6;
        ball.vx = -Math.cos(bounceAngle) * speed;
        ball.vy = Math.sin(bounceAngle) * speed;
      }
    }

    function checkScore() {
      if (ball.x - ball.radius <= 0) {
        rightScore++;
        rightScoreEl.textContent = rightScore;
        resetBall(1);
      }

      if (ball.x + ball.radius >= canvas.width) {
        leftScore++;
        leftScoreEl.textContent = leftScore;
        resetBall(-1);
      }
    }

    function update() {
      updatePaddles();

      ball.x += ball.vx;
      ball.y += ball.vy;

      handleWallCollision();
      handlePaddleCollision();
      checkScore();
    }

    function drawNet() {
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(paddle) {
      ctx.fillStyle = paddle.color;
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.fillStyle = ball.color;
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawNet();
      drawPaddle(leftPaddle);
      drawPaddle(rightPaddle);
      drawBall();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    resetBall(1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
